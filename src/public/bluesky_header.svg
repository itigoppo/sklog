    <!-- サブタイトル (Bluesky Archiver & Calendar) -->
    <text x="5" y="35" font-family="'Outfit', 'Segoe UI', -apple-system, sans-serif" font-weight="500" font-size="22px" fill="#94a3b8" letter-spacing="6px">Bluesky Archiver &amp; Calendar</text>
  </g>

</svg>