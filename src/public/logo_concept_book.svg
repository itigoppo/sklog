<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="512" height="512">
  <defs>
    <!-- ネオン系の上品な3色グラデーション -->
    <linearGradient id="su-neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />     <!-- スカイブルー -->
      <stop offset="60%" stop-color="#818cf8" />     <!-- インディゴ -->
      <stop offset="100%" stop-color="#c084fc" />    <!-- パープル -->
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&amp;display=swap');
      .log-tail-embed {
        font-family: 'Outfit', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 1.55px;
        letter-spacing: 0.08px;
      }
    </style>
  </defs>

  <!-- 1. 元の完璧な蝶 of シルエット -->
  <path d="M12 10.3c-.6-1.5-1.8-3-3.5-3.8C6.3 5.4 3.5 5.8 2.2 7c-1.3 1.2-1.5 4 .2 6.6.9 1.4 2.3 2.8 4.1 3.8.5.3 1.1.5 1.7.7-1 1.5-2 3-2 4.1 0 .6.4 1 1 1 .6 0 1.2-.4 1.8-1 1.2-1.2 2.2-2.8 3-4.4.8 1.6 1.8 3.2 3 4.4.6.6 1.2 1 1.8 1 .6 0 1-.4 1-1 0-1.1-1-2.6-2-4.1.6-.2 1.2-.4 1.7-.7 1.8-1 3.2-2.4 4.1-3.8 1.7-2.6 1.5-5.4.2-6.6-1.3-1.2-4.1-1.6-6.3-.5-1.7.8-2.9 2.3-3.5 3.8z" fill="url(#su-neon-grad)" />

  <!-- 2. 右下の「足（尾）」の中に、背景の漆黒（#020617）でシャープに白抜き刻印された「log」 -->
  <!-- 足の太さと傾きに完全にシンクロさせるため、45度傾けて足の中央へ美しくマッピング -->
  <text x="13.55" y="17.65" fill="#020617" class="log-tail-embed" transform="rotate(45 13.55 17.65)" opacity="0.98">log</text>
</svg>